name: Build ALIET Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find project directory
        id: project
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort

          PACKAGE=$(find . -name package.json -not -path './node_modules/*' | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json was not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "Found package.json: $PACKAGE"
          echo "Project directory: $PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Add Android platform
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: ./gradlew assembleDebug

      - name: Find APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "APK files:"
          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALIET-CGPA-Calculator-APK
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
